services:
  - type: web
    name: agroeco-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AI_MODE
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_IMAGE_SIZE_MB
        value: "10"
      - key: LOG_LEVEL
        value: INFO
      - key: MODEL_PATH
        value: app/services/ai/weights/crop_disease_mobilenet.pt
